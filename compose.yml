name: qcash-api

services:
    api:
        image: ${QCASH_IMAGE:-qcash-api}:${QCASH_IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: Dockerfile
            target: runtime
        init: true
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - .env
        environment:
            APP_ENV: ${APP_ENV:-production}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-3005}}
            LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: "5432"
            DB_DATABASE: ${POSTGRES_DB:-q_cash}
            DB_USERNAME: ${POSTGRES_USER:-qcash}
            DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            QCASH_ML_API_URL: ${QCASH_ML_API_URL:-}
        volumes:
            - qcash-storage:/var/www/html/storage
            - ./.env:/var/www/html/.env
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS http://127.0.0.1/up >/dev/null || exit 1",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - default
            - web-proxy

    db:
        image: postgres:16-alpine
        restart: unless-stopped
        stop_grace_period: 30s
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-q_cash}
            POSTGRES_USER: ${POSTGRES_USER:-qcash}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        volumes:
            - qcash-db:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - default
volumes:
    qcash-storage:
    qcash-db:

networks:
    web-proxy:
        external: true
